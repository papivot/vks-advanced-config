# Custom TuneD profile applied to one worker pool.
# The TuneDProfile CR lives in the Cluster's namespace and is immutable: to change
# settings, create database-performance-v2 and point the Cluster at it.
apiVersion: os.kubernetes.vmware.com/v1alpha1
kind: TuneDProfile
metadata:
  name: database-performance
  namespace: my-vsphere-namespace
spec:
  content: |
    [main]
    summary=Stateful database workloads
    include=throughput-performance

    [sysctl]
    vm.max_map_count=262144
    vm.swappiness=1
    fs.file-max=2097152
    net.core.somaxconn=4096
    net.ipv4.tcp_keepalive_time=600
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: my-cluster
  namespace: my-vsphere-namespace
spec:
  clusterNetwork:
    services:
      cidrBlocks: ["198.201.0.0/16"]
    pods:
      cidrBlocks: ["193.0.0.0/16"]
    serviceDomain: cluster.local
  topology:
    classRef:
      name: builtin-generic-v3.6.0
      namespace: vmware-system-vks-public
    version: v1.34.1---vmware.1-vkr.1
    controlPlane:
      replicas: 3
    workers:
      machineDeployments:
      - class: node-pool
        name: database-pool
        replicas: 3
        variables:
          overrides:
          - name: osConfiguration            # <-- tuned (this pool only)
            value:
              tuned:
                active:
                - database-performance
                profiles:
                  database-performance:
                    profileRef:
                      name: database-performance
    variables:
    - name: vmClass
      value: best-effort-small
    - name: storageClass
      value: <storage-class>
