# Scope ubuntuPro per machineDeployment: only "pro-pool" is attached to Ubuntu Pro, using
# its own token Secret. "plain-pool" has no override, so it is not attached.
apiVersion: v1
kind: Secret
metadata:
  name: ubuntu-pro-token-team-a
  namespace: my-vsphere-namespace
type: Opaque
stringData:
  token: <your-ubuntu-pro-token>
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: my-cluster
  namespace: my-vsphere-namespace
spec:
  clusterNetwork:
    services:
      cidrBlocks: ["198.201.0.0/16"]
    pods:
      cidrBlocks: ["193.0.0.0/16"]
    serviceDomain: cluster.local
  topology:
    classRef:
      name: builtin-generic-v3.6.0
      namespace: vmware-system-vks-public
    version: v1.34.1---vmware.1-vkr.1
    controlPlane:
      replicas: 3
      metadata:
        annotations:
          run.tanzu.vmware.com/resolve-os-image: os-name=ubuntu
    workers:
      machineDeployments:
      - class: node-pool
        name: pro-pool
        replicas: 3
        metadata:
          annotations:
            run.tanzu.vmware.com/resolve-os-image: os-name=ubuntu
        variables:
          overrides:
          - name: osConfiguration            # <-- ubuntuPro (this pool only)
            value:
              ubuntuPro:
                tokenSecretRef: ubuntu-pro-token-team-a
                services:
                - esm-infra
                - esm-apps
      - class: node-pool
        name: plain-pool
        replicas: 3
        metadata:
          annotations:
            run.tanzu.vmware.com/resolve-os-image: os-name=ubuntu
    variables:
    - name: vmClass
      value: best-effort-small
    - name: storageClass
      value: <storage-class>
