# Enable AIDE only where needed: the control plane and one worker pool.
# Each override replaces the whole osConfiguration value for that scope, so repeat any other
# osConfiguration settings inside the override if that scope needs them.
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: my-cluster
  namespace: my-vsphere-namespace
spec:
  clusterNetwork:
    services:
      cidrBlocks: ["198.201.0.0/16"]
    pods:
      cidrBlocks: ["193.0.0.0/16"]
    serviceDomain: cluster.local
  topology:
    classRef:
      name: builtin-generic-v3.8.0
      namespace: vmware-system-vks-public
    # To verify: the Kubernetes 1.37 minimum for AIDE comes from VKS behavior, not the public variable docs.
    version: v1.37.1---vmware.1-vkr.1
    controlPlane:
      replicas: 3
      variables:
        overrides:
        - name: osConfiguration              # <-- aide (control plane)
          value:
            aide:
              enabled: true
    workers:
      machineDeployments:
      - class: node-pool
        name: hardened-pool
        replicas: 3
        variables:
          overrides:
          - name: osConfiguration            # <-- aide (this pool only)
            value:
              aide:
                enabled: true
      - class: node-pool
        name: general-pool                   # no override: AIDE stays off
        replicas: 3
    variables:
    - name: vmClass
      value: best-effort-small
    - name: storageClass
      value: <storage-class>
