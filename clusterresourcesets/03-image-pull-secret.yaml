# Example 3: Secret-sourced CRS that delivers an image pull secret to labelled guest clusters.
# The Secret type MUST be addons.cluster.x-k8s.io/resource-set. Any key name works; the value
# is the YAML applied to the guest cluster. Delivered only to clusters labelled
# registry-secret=required.
apiVersion: v1
kind: Secret
metadata:
  name: registry-pull-secret-bootstrap
  namespace: my-vsphere-namespace
type: addons.cluster.x-k8s.io/resource-set
stringData:
  bootstrap.yaml: |
    apiVersion: v1
    kind: Namespace
    metadata:
      name: my-app
    ---
    apiVersion: v1
    kind: Secret
    metadata:
      name: regcred
      namespace: my-app
    type: kubernetes.io/dockerconfigjson
    stringData:
      .dockerconfigjson: |
        {"auths":{"<registry>":{"username":"<user>","password":"<token>","auth":"<base64 user:token>"}}}
---
apiVersion: addons.cluster.x-k8s.io/v1beta2
kind: ClusterResourceSet
metadata:
  name: registry-pull-secret
  namespace: my-vsphere-namespace
spec:
  strategy: ApplyOnce            # credentials are not re-pushed; use Reconcile to rotate
  clusterSelector:
    matchLabels:
      registry-secret: required
  resources:
    - kind: Secret
      name: registry-pull-secret-bootstrap
