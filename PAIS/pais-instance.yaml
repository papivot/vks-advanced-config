# Private AI Services instance for the vSphere Namespace "pais", applied with kubectl.
# Based on the working object "default" in namespace pais. Replace every <...> value first.
#
#   kubectl --context <ctx> apply -f pais-instance.yaml
#
# Order matters little: the controller waits for the Secrets, but creating them first is cleaner.
# The object MUST be named "default" (the controller reports its results to PAISConfiguration "default").

# ---------------------------------------------------------------------------------------------
# 1. Login users for the built-in "staticCredentials" provider (lab / proof-of-concept use only).
#    credentials.json is a JSON list. Each entry has:
#      userID   a unique id you choose
#      username the login name
#      hash     a SHA-512 crypt hash ("$6$<salt>$<hash>", 106 characters), NOT the plain password.
#    Create a hash with:   openssl passwd -6 'the-password'
#    Example uses password of "Vmware1!" 
# ---------------------------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: pais-static-credentials
  namespace: pais
type: Opaque
stringData:
  credentials.json: |
    [
      {
        "userID": "test",
        "username": "testuser",
        "hash": "$6$J7DDi1Vjo8o/CcIU$ziy57OO4VBO37lzaztY4wuav1EbXwvdZ4qWUVKUAuQStXXCobmNHjVlp1SqnaACOZwK4HeOGCOs3U7ioTzMy5/"
      }
    ]
---
# ---------------------------------------------------------------------------------------------
# 2. Password (and CA) for the PostgreSQL database.
#    "password"  the database user's password, as plain text.
#    "ca.crt"    REQUIRED KEY. PEM of the CA that signed the database's TLS certificate.
#                The vSphere wizard will not save an empty certificate, and the setup job fails with
#                "references non-existent secret key: ca.crt" if the key is missing. In this lab the
#                database has no TLS and sslMode is Allow, so the value below is a DUMMY self-signed
#                certificate (CN=placeholder-ca, no private key kept). It is never used to verify anything.
#                With sslMode Require, VerifyCA or VerifyFull, put the real CA PEM here and enable TLS
#                on the database first.
# ---------------------------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: pais-database
  namespace: pais
type: Opaque
stringData:
  password: "<database-password>"
  # This is a place holder dummy CA if there is postgres is not behind TLS.
  ca.crt: |
