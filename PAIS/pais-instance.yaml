apiVersion: pais.vmware.com/v1alpha1
kind: PAISConfiguration
metadata:
  name: default
  namespace: pais
  annotations:
    pais.vmware.com/default-failure-domain: zone0
    ui.pais.vmware.com/pais-enablement-db: self-managed
    ui.pais.vmware.com/pais-enablement-environment-connectivity: connected
    # FQDN the UI uses instead of the load balancer IP when switching between its components.
    # Same hostname as issuerBaseUrl below, without "https://". Needed for API token generation.
    paisconfigurations.pais.vmware.com/cname: <pais-hostname>  
    # Zone used for model endpoints that do not set spec.failureDomain.
    # The controller sets this itself when the namespace has zones; keep it to pin the zone.
    pais.vmware.com/default-failure-domain: zone0
spec:
  # Storage class used by all components. Must be assigned to this namespace.
  defaultStorageClassName: vsan-default-storage-policy

  auth:
    providers:
      - name: sc                                  # 2-8 lowercase alphanumeric characters
        staticCredentials:
          issuerBaseUrl: https://<pais-hostname>  # must resolve (DNS) to the ingress load balancer IP
          credentialsSecretRef:
            name: pais-static-credentials         # Secret 1 above
            key: credentials.json
          apiTokens:                              # without this block no API tokens are issued (interactive login only)
            expirationDefault: 720h               # lifetime when a token request gives none
            expirationMax: 8760h                  # longest lifetime a caller may request
  database:                                       # PostgreSQL with the pgvector extension installed
    host: <database-ip-or-hostname>
    port: 5432
    dbname: testdb
    username: testuser                    # see "Database prerequisites" below
    sslMode: Allow                                # Allow | Require | VerifyCA | VerifyFull
    passwordRef:
      name: pais-database                         # Secret 2 above
      fieldPath: password                         # key holding the password; "ca.crt" is read from the same Secret

  ingress:
    serviceType: LoadBalancer                     # or ClusterIP
    # tlsSecretRef:                               # optional: your own certificate for the ingress
    #   name: <kubernetes.io/tls Secret with tls.crt and tls.key; must cover issuerBaseUrl's hostname>

  vksControlPlane:                                # the VKS cluster that will host model endpoints
    storageClassName: vsan-default-storage-policy
    virtualMachineClassName: best-effort-medium   # control-plane VM only; model workers are sized per ModelEndpoint

  upgradeStrategy:
    automatic: {}

# Database prerequisites (the setup job runs as the database user above):
#   - the database exists, and the pgvector extension is installed in it:  CREATE EXTENSION vector;
#     (needs a superuser; the job's own "CREATE EXTENSION IF NOT EXISTS" then does nothing)
#   - the user can create roles (CREATEROLE) and create objects in the database. In this lab the user
#     was made a superuser, which is more than a real deployment should grant.
#
# Optional sections not set here (see: kubectl explain paisconfigurations.spec):
#   clientTls, nvidiaConfig, observability, runtimeConfig, worker
